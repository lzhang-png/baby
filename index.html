<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const stored = localStorage.getItem("baby-theme") || "dark"
        const resolved =
          stored === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : stored
        document.documentElement.classList.toggle("dark", resolved === "dark")
        document.documentElement.style.colorScheme = resolved
        const textSize = localStorage.getItem("baby-text-size")
        if (textSize && textSize !== "default") {
          document.documentElement.setAttribute("data-text-size", textSize)
        }
      } catch (_) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Luca's Feeding & Sleep Plan</title>
  </head>
  <body>
    <div id="root">
      <p style="margin: 0; padding: 2rem; font-family: system-ui, sans-serif; color: #a1a1aa; text-align: center;">
        Loading…
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root")
        if (!root || root.childElementCount > 1) return
        root.innerHTML =
          '<div style="margin:2rem auto;max-width:28rem;padding:1.25rem;border:1px solid #3f3f46;border-radius:0.75rem;font-family:system-ui,sans-serif;color:#fafafa;background:#18181b;">' +
          '<p style="margin:0 0 0.5rem;font-weight:600;">App failed to start</p>' +
          '<p style="margin:0;font-size:0.875rem;color:#a1a1aa;">' +
          (event.message || "Unknown error") +
          ". Try a hard refresh, disable private browsing, or check the browser console." +
          "</p></div>"
      })
    </script>
  </body>
</html>
