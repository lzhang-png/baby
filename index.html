<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const stored = localStorage.getItem("baby-theme") || "dark"
        const resolved =
          stored === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : stored
        document.documentElement.classList.toggle("dark", resolved === "dark")
        document.documentElement.style.colorScheme = resolved
        const textSize = localStorage.getItem("baby-text-size")
        if (textSize && textSize !== "default") {
          document.documentElement.setAttribute("data-text-size", textSize)
        }
      } catch (_) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Baby Timeline</title>
    <style>
      #boot-fallback {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #18181b;
        color: #fafafa;
        text-align: center;
      }
      #boot-error {
        display: none;
        max-width: 36rem;
        margin: 2rem auto;
        padding: 1.25rem;
        border: 1px solid #3f3f46;
        border-radius: 0.75rem;
        font-family: system-ui, sans-serif;
        color: #fafafa;
        background: #18181b;
        text-align: left;
      }
      #boot-error h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
      }
      #boot-error p {
        margin: 0.5rem 0 0;
        font-size: 0.875rem;
        color: #a1a1aa;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #boot-error code {
        color: #e4e4e7;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <p id="boot-fallback">Loading app…</p>
    </div>
    <div id="boot-error" role="alert">
      <h1>App failed to start</h1>
      <p id="boot-error-message"></p>
    </div>
    <script>
      ;(function () {
        var mounted = false

        function showBootError(message) {
          if (mounted) return
          var root = document.getElementById("root")
          var panel = document.getElementById("boot-error")
          var messageEl = document.getElementById("boot-error-message")
          if (!panel || !messageEl) return
          if (root) root.style.display = "none"
          panel.style.display = "block"
          messageEl.textContent =
            message +
            "\n\nURL: " +
            window.location.href +
            "\n\nTry:\n1. npm install\n2. npm run dev\n3. Open the exact URL Vite prints (http://localhost:5173/)\n4. Hard refresh (Cmd+Shift+R)\n5. Use Chrome/Safari instead of an embedded preview"
        }

        window.__markAppMounted = function () {
          mounted = true
          var panel = document.getElementById("boot-error")
          if (panel) panel.style.display = "none"
        }

        window.addEventListener("error", function (event) {
          showBootError(event.message || "Unknown script error")
        })

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason
          showBootError(
            reason && reason.message
              ? reason.message
              : String(reason || "Unhandled promise rejection"),
          )
        })

        setTimeout(function () {
          var root = document.getElementById("root")
          if (mounted || (root && root.dataset.appMounted === "true")) return
          showBootError(
            "The app did not mount within 8 seconds. The dev server may be stopped, dependencies may be missing, or JavaScript modules failed to load.",
          )
        }, 8000)
      })()
    </script>
    <script type="module">
      import("/src/bootstrap.tsx")
        .then(function (mod) {
          mod.mountApp()
          window.__markAppMounted?.()
        })
        .catch(function (err) {
          var message =
            err && err.message ? err.message : String(err || "Failed to load app")
          var panel = document.getElementById("boot-error")
          var messageEl = document.getElementById("boot-error-message")
          var root = document.getElementById("root")
          if (root) root.style.display = "none"
          if (panel) panel.style.display = "block"
          if (messageEl) {
            messageEl.textContent =
              message +
              "\n\nURL: " +
              location.href +
              "\n\nTry:\n1. npm install\n2. npm run dev\n3. Open http://localhost:5173/"
          }
        })
    </script>
  </body>
</html>
